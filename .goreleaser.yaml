version: 2
project_name: jev
builds:
  - id: jev
    main: ./cmd/jev
    binary: jev
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/therealbill/typesafe-go/internal/version.Version={{ .Version }}
      - -X github.com/therealbill/typesafe-go/internal/version.Commit={{ .ShortCommit }}
archives:
  - id: jev
    formats: [tar.gz]
    name_template: "jev_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  use: git
release:
  github:
    owner: therealbill
    name: typesafe-go
